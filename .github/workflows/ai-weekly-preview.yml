name: AI Weekly Preview

# 스파크랩 AI 위클리(월요일 AI 미팅용) — 음성만 만든다(scripts/preview-ai-weekly.ts --voice). 발행하지 않는다.
# data/ai-weekly/<월요일 날짜>.json을 이 브랜치에 푸시하면 가장 최근에 바뀐 확정 파일로 클로이 목소리를 합성해
# Artifacts(ai-weekly-voice)에 wav·voice.json을 남긴다. 기사 사진을 넣은 화면·영상은 은빛 PC에서 만든다(사진이 공개 저장소를 거치지 않게).
# 데일리 브리핑(briefing-preview.yml)과 파일·동시 실행 그룹이 따로다.
on:
  push:
    branches: [eunbit/briefing-daily-v2]
    paths: ['data/ai-weekly/**']
  workflow_dispatch:
    inputs:
      date:
        description: '미팅 날짜(월요일, 예: 2026-11-23) — data/ai-weekly/<날짜>.json'
        required: true
        type: string

concurrency:
  group: ai-weekly-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../gcp-sa.json
      # script.ts가 불러질 때 Prisma·OpenAI 클라이언트를 만든다(호출은 하지 않음) — 데일리와 같은 값을 넘겨 둔다.
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      - name: Write GCP credentials
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Synthesize AI weekly voice (no publish)
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then FIXED="data/ai-weekly/${INPUT_DATE}.json"
          else FIXED=$(git diff --name-only HEAD~1 HEAD -- 'data/ai-weekly/*.json' | sort | tail -1)
          fi
          [ -n "$FIXED" ] && [ -f "$FIXED" ] || { echo "확정 파일이 없습니다: '$FIXED'"; exit 1; }
          echo "확정 파일: $FIXED"
          npx tsx scripts/preview-ai-weekly.ts "$FIXED" --voice --out out/ai-weekly/voice

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-weekly-voice
          path: out/ai-weekly/voice/
          retention-days: 7
          if-no-files-found: ignore
